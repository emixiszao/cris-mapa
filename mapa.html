<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa</title>
<style>
  :root { --u:1; --verde:#4fd47c; --ouro:#ffc83d; --roxo:#7a5cd6; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:transparent; color:#fff;
               font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  button, input, textarea { font:inherit; }

  #raiz { position:fixed; inset:0; display:flex; gap:12px; padding:14px; }
  #area { flex:1; min-width:0; position:relative; display:flex; align-items:center; justify-content:center; }

  /* ---------- o mapa ---------- */
  #palco { position:relative; flex:none; perspective:2200px; }
  #papel { position:absolute; inset:0; transform-style:preserve-3d; }
  #plano { position:absolute; inset:0; background:url(mapa.webp) center / 100% 100% no-repeat; opacity:0;
           filter:drop-shadow(0 12px 28px rgba(0,0,0,.75)); }
  #pins { position:absolute; inset:0; visibility:hidden; }

  /* dobras (animação de desdobrar) */
  .dobra { position:absolute; left:100%; top:0; transform-origin:left center; transform-style:preserve-3d;
           background:url(mapa.webp) no-repeat; }
  #papel > .dobra { left:0; }
  .sombra { position:absolute; inset:0; pointer-events:none; opacity:0;
            background:linear-gradient(90deg, rgba(0,0,0,.7), rgba(0,0,0,.05) 70%); }

  /* ---------- pins ---------- */
  .pin { position:absolute; width:calc(30px * var(--u)); height:calc(42px * var(--u)); transform:translate(-50%, -100%); z-index:1; touch-action:none; }
  .pin svg { width:100%; height:100%; display:block; overflow:visible; filter:drop-shadow(0 3px 4px rgba(0,0,0,.65)); transition:transform .15s; }
  .pin:hover { z-index:50; }
  .pin:hover svg { transform:translateY(-3px) scale(1.08); }
  .gm .pin { cursor:grab; }
  .pin.arrastando { cursor:grabbing; z-index:60; }
  .pin.arrastando svg { transform:translateY(-6px) scale(1.12); }
  .pin.sel .gota { stroke:#ffd86b; stroke-width:3; }
  .pin.entra { animation:pop .45s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes pop { from { opacity:0; transform:translate(-50%, -100%) scale(.2); } }

  /* a abinha que desliza ao lado do pin */
  .aba { position:absolute; top:calc(-2px * var(--u)); left:calc(100% + 6px * var(--u)); width:calc(250px * var(--u));
         padding:calc(10px * var(--u)) calc(12px * var(--u)) calc(11px * var(--u)); text-align:left;
         background:rgba(14,12,18,.95); border:1px solid rgba(255,255,255,.4); border-radius:calc(10px * var(--u));
         box-shadow:0 6px 18px rgba(0,0,0,.6); pointer-events:none;
         opacity:0; clip-path:inset(0 100% 0 0); transform:translateX(calc(-10px * var(--u)));
         transition:clip-path .28s ease, opacity .2s ease, transform .28s ease; }
  .pin:hover .aba, .pin.aberto .aba { opacity:1; clip-path:inset(0 0 0 0); transform:none; }
  .pin.esq .aba { left:auto; right:calc(100% + 6px * var(--u)); clip-path:inset(0 0 0 100%); transform:translateX(calc(10px * var(--u))); }
  .pin.esq:hover .aba, .pin.esq.aberto .aba { clip-path:inset(0 0 0 0); transform:none; }
  .pin.cima .aba { top:auto; bottom:calc(6px * var(--u)); }
  .pin.arrastando .aba { display:none; }
  .aba .nome { font-size:calc(21px * var(--u)); font-weight:800; line-height:1.15; color:#fff; padding-right:calc(40px * var(--u)); overflow-wrap:anywhere; }
  .aba .nota-canto { position:absolute; top:calc(10px * var(--u)); right:calc(12px * var(--u)); font-size:calc(14px * var(--u)); font-weight:800; color:var(--ouro); }
  .estrelas { position:relative; display:inline-block; margin:calc(4px * var(--u)) 0 calc(2px * var(--u)); font-size:calc(18px * var(--u)); line-height:1; letter-spacing:2px; white-space:nowrap; }
  .estrelas .base { color:#4a4658; }
  .estrelas .cheio { position:absolute; left:0; top:0; overflow:hidden; color:var(--ouro); }
  .aba .horario { margin-top:calc(4px * var(--u)); color:var(--verde); font-size:calc(12px * var(--u)); line-height:1.3; }
  .aba .horario b { display:block; font-size:calc(14px * var(--u)); }
  .aba .desc { margin-top:calc(6px * var(--u)); font-size:calc(12px * var(--u)); line-height:1.4; color:#ece8f2; overflow-wrap:anywhere; white-space:pre-wrap; }

  /* ---------- botão fechar ---------- */
  #x { position:fixed; top:16px; right:16px; z-index:100; width:40px; height:40px; border-radius:50%; border:2px solid rgba(255,255,255,.7);
       background:rgba(14,12,18,.9); color:#fff; font-size:20px; line-height:1; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.6); }
  #x:hover { background:#7d2630; }
  #x:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible { outline:2px solid var(--roxo); outline-offset:2px; }

  /* ---------- painel do mestre ---------- */
  #gm { width:310px; flex:none; height:100%; margin-top:0; overflow:auto; padding:12px; background:#16131d; border:1px solid #3a3350; border-radius:12px; }
  #gm[hidden] { display:none; }
  #gm button { border:0; border-radius:8px; padding:8px 10px; color:#fff; font-weight:600; cursor:pointer; background:#2e2840; }
  #gm button:hover { filter:brightness(1.25); }
  #gm button.principal { background:var(--roxo); }
  #gm button.perigo { background:#7d2630; width:100%; }
  .gm-topo { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:0 52px 10px 0; }
  .gm-topo b { font-size:15px; }
  #lista { display:grid; gap:4px; max-height:230px; overflow:auto; margin-bottom:12px; }
  #lista button { display:flex; align-items:center; justify-content:space-between; gap:8px; text-align:left; background:#1f1b2a; border:1px solid #322c42; font-weight:500; }
  #lista button.sel { border-color:#fff; background:#2a2342; }
  #lista .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #lista .tag { flex:none; font-size:10px; letter-spacing:.05em; text-transform:uppercase; padding:2px 6px; border-radius:99px; }
  #lista .tag.no { background:#173d27; color:var(--verde); }
  #lista .tag.guard { background:#2b2838; color:#9a93ad; }
  #gm button.largo { width:100%; margin-bottom:12px; }
  #palco.colocando #pins { cursor:crosshair; }
  #colocar-aviso { position:absolute; top:6px; left:50%; transform:translateX(-50%); z-index:90; padding:8px 14px; border-radius:10px;
                   background:rgba(14,12,18,.96); border:1px solid #ffd86b; font-size:13px; text-align:center; max-width:90%; }
  #colocar-aviso[hidden] { display:none; }
  .campo { display:grid; gap:4px; margin-bottom:10px; }
  .campo > label, .rotulo { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:#9a93ad; }
  #gm input[type=text], #gm input[type=time], #gm textarea { width:100%; padding:7px 8px; border:1px solid #322c42; border-radius:7px; background:#0f0d15; color:#fff; }
  #gm textarea { min-height:90px; resize:vertical; }
  #gm input[type=range] { width:100%; accent-color:var(--roxo); }
  .linha { display:flex; align-items:center; gap:8px; }
  .linha > * { flex:1; }
  .nota-linha { display:flex; align-items:center; gap:10px; }
  .nota-linha span { min-width:34px; text-align:right; font-weight:800; color:var(--ouro); }
  .check { display:flex; align-items:center; gap:8px; font-size:13px; }
  .dica { color:#9a93ad; font-size:12px; line-height:1.5; padding:6px 2px; }

  @media (prefers-reduced-motion:reduce) { .pin.entra { animation:none; } .aba { transition:none; } }
</style>
</head>
<body>
  <div id="raiz">
    <div id="area">
      <div id="colocar-aviso" hidden></div>
      <div id="palco">
        <div id="plano"></div>
        <div id="papel"></div>
        <div id="pins"></div>
      </div>
    </div>
    <aside id="gm" hidden>
      <div class="gm-topo"><b>Locais do mapa</b><button class="principal" id="novo">+ Novo local</button></div>
      <div id="lista"></div>
      <div id="editor"></div>
    </aside>
  </div>
  <button id="x" aria-label="Fechar o mapa" title="Fechar (Esc)">✕</button>

<script type="module">
import OBR from "https://esm.sh/@owlbear-rodeo/sdk@3";

const KEY = "com.cris.mapa/pins";
const MODAL_ID = "com.cris.mapa/janela";
const N_DOBRAS = 4;

let pins = [];
let isGM = false;
let selecionado = null;
let editorPara = null;
let arrastando = null;
let ratio = 1;
const abertos = new Set();   // abinhas abertas por toque/clique (jogadores)

const $ = id => document.getElementById(id);
const el = (tag, props = {}, ...filhos) => {
  const e = document.createElement(tag);
  Object.assign(e, props);
  filhos.forEach(f => e.append(f));
  return e;
};
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmtNota = n => Number(n).toFixed(1).replace(".", ",");
const textoErro = e => e?.error?.message ?? e?.message ?? JSON.stringify(e);

// ---------- dados ----------
function normalizar(lista) {
  return (Array.isArray(lista) ? lista : []).map(p => ({
    id: String(p.id),
    nome: String(p.nome ?? "Sem nome"),
    x: clamp(p.x == null || !Number.isFinite(Number(p.x)) ? 0.5 : Number(p.x), 0, 1),
    y: clamp(p.y == null || !Number.isFinite(Number(p.y)) ? 0.5 : Number(p.y), 0, 1),
    noMapa: p.noMapa === undefined ? p.x != null : !!p.noMapa,   // false = local guardado, ainda sem pin
    nota: clamp(Number(p.nota) || 0, 0, 5),
    horario: { sem: !!p.horario?.sem, abre: p.horario?.abre || "08:00", fecha: p.horario?.fecha || "18:00" },
    descricao: String(p.descricao ?? "")
  }));
}

async function salvar(mutar) {
  if (!isGM) return;
  try {
    const meta = await OBR.room.getMetadata();
    const lista = structuredClone(normalizar(meta[KEY]));
    mutar(lista);
    await OBR.room.setMetadata({ [KEY]: lista });
  } catch (e) {
    OBR.notification.show("Não foi possível salvar: " + textoErro(e), "ERROR");
  }
}
const editar = (id, fn) => salvar(l => { const p = l.find(x => x.id === id); if (p) fn(p); });

// ---------- tamanho do mapa ----------
function aplicarTamanho() {
  const a = $("area").getBoundingClientRect();
  const w = Math.max(100, Math.min(a.width - 16, (a.height - 16) * ratio));
  const h = w / ratio;
  $("palco").style.width = w + "px";
  $("palco").style.height = h + "px";
  document.documentElement.style.setProperty("--u", clamp(w / 1000, 0.75, 1.5));
  return { w, h };
}

// ---------- animação: o mapa se desdobra ----------
async function desdobrar(w, h) {
  const papel = $("papel");
  papel.replaceChildren();
  const pw = w / N_DOBRAS;
  const paineis = [];
  let pai = papel;
  for (let i = 0; i < N_DOBRAS; i++) {
    const d = el("div", { className: "dobra" });
    d.style.width = pw + "px";
    d.style.height = h + "px";
    d.style.backgroundSize = `${N_DOBRAS * 100}% 100%`;
    d.style.backgroundPosition = `${(i / (N_DOBRAS - 1)) * 100}% 0`;
    const sombra = el("div", { className: "sombra" });
    d.append(sombra);
    pai.append(d);
    paineis.push({ d, sombra });
    pai = d;
  }

  const angulos = [0, -168, 170, -168];
  const passo = 320, dur = 820, total = (N_DOBRAS - 1) * passo + dur;
  const animacoes = [];
  animacoes.push(papel.animate([
    { transform: `translateX(${w * (0.5 - 0.5 / N_DOBRAS)}px) scale(.8) rotateZ(-5deg)` },
    { transform: "translateX(0) scale(1) rotateZ(0deg)" }
  ], { duration: total, easing: "cubic-bezier(.3,.7,.3,1)", fill: "both" }));
  for (let i = 1; i < N_DOBRAS; i++) {
    const timing = { duration: dur, delay: 120 + (i - 1) * passo, easing: "cubic-bezier(.25,.8,.3,1)", fill: "both" };
    animacoes.push(paineis[i].d.animate([{ transform: `rotateY(${angulos[i]}deg)` }, { transform: "rotateY(0deg)" }], timing));
    animacoes.push(paineis[i].sombra.animate([{ opacity: 0.75 }, { opacity: 0 }], timing));
  }
  await Promise.all(animacoes.map(a => a.finished.catch(() => {})));
  // troca as dobras pela imagem inteira
  $("plano").style.opacity = "1";
  animacoes.forEach(a => a.cancel());
  papel.replaceChildren();
}

// ---------- pins ----------
const SVG_NS = "http://www.w3.org/2000/svg";
function gota() {
  const svg = document.createElementNS(SVG_NS, "svg");
  svg.setAttribute("viewBox", "0 0 24 32");
  svg.setAttribute("aria-hidden", "true");
  const forma = document.createElementNS(SVG_NS, "path");
  forma.setAttribute("class", "gota");
  forma.setAttribute("d", "M12 1C5.9 1 1 5.8 1 11.8 1 19.6 12 31 12 31S23 19.6 23 11.8C23 5.8 18.1 1 12 1z");
  forma.setAttribute("fill", "#c8323c");
  forma.setAttribute("stroke", "#fff");
  forma.setAttribute("stroke-width", "1.8");
  const centro = document.createElementNS(SVG_NS, "circle");
  centro.setAttribute("cx", "12"); centro.setAttribute("cy", "11.8"); centro.setAttribute("r", "4.4");
  centro.setAttribute("fill", "#fff");
  svg.append(forma, centro);
  return svg;
}

function montarAba(p) {
  const aba = el("div", { className: "aba" });
  aba.append(el("div", { className: "nome", textContent: p.nome }));
  aba.append(el("div", { className: "nota-canto", textContent: fmtNota(p.nota) }));
  const est = el("div", { className: "estrelas", role: "img", ariaLabel: `Avaliação ${fmtNota(p.nota)} de 5` },
    el("span", { className: "base", textContent: "★★★★★" }),
    el("span", { className: "cheio", textContent: "★★★★★" }));
  est.querySelector(".cheio").style.width = (p.nota / 5) * 100 + "%";
  aba.append(est);
  if (!p.horario.sem) {
    const mesmo = p.horario.abre === p.horario.fecha;
    aba.append(el("div", { className: "horario" }, "Horário de Funcionamento",
      el("b", { textContent: mesmo ? "24 horas" : `${p.horario.abre} às ${p.horario.fecha}` })));
  }
  if (p.descricao.trim()) aba.append(el("div", { className: "desc", textContent: p.descricao }));
  return aba;
}

function ligarArraste(e, p) {
  e.addEventListener("pointerdown", ev => {
    if (!isGM || ev.button !== 0) return;
    ev.preventDefault();
    const r = $("pins").getBoundingClientRect();
    arrastando = {
      id: p.id, x: p.x, y: p.y, moveu: false, r, el: e,
      sx: ev.clientX, sy: ev.clientY,
      dx: ev.clientX - (r.left + p.x * r.width), dy: ev.clientY - (r.top + p.y * r.height)
    };
    e.setPointerCapture?.(ev.pointerId);
  });
  e.addEventListener("pointermove", ev => {
    const a = arrastando;
    if (!a || a.id !== p.id) return;
    if (!a.moveu && Math.hypot(ev.clientX - a.sx, ev.clientY - a.sy) > 4) { a.moveu = true; e.classList.add("arrastando"); }
    if (!a.moveu) return;
    a.x = clamp((ev.clientX - a.dx - a.r.left) / a.r.width, 0, 1);
    a.y = clamp((ev.clientY - a.dy - a.r.top) / a.r.height, 0, 1);
    e.style.left = a.x * 100 + "%";
    e.style.top = a.y * 100 + "%";
  });
  const soltar = async () => {
    const a = arrastando;
    if (!a || a.id !== p.id) return;
    arrastando = null;
    e.classList.remove("arrastando");
    if (a.moveu) await editar(p.id, x => { x.x = a.x; x.y = a.y; });
    else selecionar(p.id);
  };
  e.addEventListener("pointerup", soltar);
  e.addEventListener("pointercancel", () => { arrastando = null; e.classList.remove("arrastando"); renderPins(); });
}

function renderPins(entrada = false) {
  $("pins").replaceChildren(...pins.filter(p => p.noMapa).map((p, i) => {
    const e = el("div", { className: "pin" + (selecionado === p.id && isGM ? " sel" : "") + (p.x > 0.6 ? " esq" : "") + (p.y > 0.72 ? " cima" : "") + (abertos.has(p.id) ? " aberto" : "") });
    e.dataset.id = p.id;
    e.style.left = p.x * 100 + "%";
    e.style.top = p.y * 100 + "%";
    if (entrada) { e.classList.add("entra"); e.style.animationDelay = i * 60 + "ms"; }
    e.append(gota(), montarAba(p));
    if (isGM) ligarArraste(e, p);
    else e.addEventListener("click", () => { abertos.has(p.id) ? abertos.delete(p.id) : abertos.add(p.id); e.classList.toggle("aberto"); });
    return e;
  }));
}

// ---------- painel do mestre ----------
function selecionar(id) {
  selecionado = id;
  renderPins();
  renderLista();
  renderEditor();
}

function renderLista() {
  const box = $("lista");
  if (!pins.length) {
    box.replaceChildren(el("div", { className: "dica", textContent: "Nenhum local ainda. Use “+ Novo local” e escreva tudo antes da sessão." }));
    return;
  }
  box.replaceChildren(...pins.map(p => {
    const b = el("button", { className: p.id === selecionado ? "sel" : "" },
      el("span", { className: "nm", textContent: p.nome }),
      el("span", { className: "tag " + (p.noMapa ? "no" : "guard"), textContent: p.noMapa ? "no mapa" : "guardado" }));
    b.addEventListener("click", () => selecionar(p.id));
    return b;
  }));
}

let editorEstado = null;
function renderEditor() {
  editorPara = selecionado;
  const box = $("editor");
  const p = pins.find(x => x.id === selecionado);
  editorEstado = p ? p.noMapa : null;
  if (!p) {
    box.replaceChildren(el("div", { className: "dica", textContent: "Escolha um local na lista para editar. Locais “guardados” não aparecem para os jogadores até você usar “Adicionar pin ao mapa”." }));
    return;
  }

  // adicionar ao mapa / tirar do mapa
  const mapaBtn = p.noMapa
    ? el("button", { className: "largo", textContent: "Tirar do mapa (guardar)" })
    : el("button", { className: "principal largo", textContent: "Adicionar pin ao mapa" });
  mapaBtn.addEventListener("click", () => {
    if (p.noMapa) editar(p.id, x => { x.noMapa = false; });
    else iniciarColocacao(p.id);
  });
  const situacao = el("div", { className: "dica", textContent: p.noMapa
    ? "Este local está no mapa. Arraste o pin para mover."
    : "Guardado: os jogadores ainda não veem este local." });

  const nome = el("input", { type: "text", value: p.nome, maxLength: 60 });
  nome.addEventListener("change", () => editar(p.id, x => { x.nome = nome.value.trim() || "Sem nome"; }));

  const nota = el("input", { type: "range", min: 0, max: 5, step: 0.5, value: p.nota });
  const notaV = el("span", { textContent: fmtNota(p.nota) });
  nota.addEventListener("input", () => { notaV.textContent = fmtNota(nota.value); });
  nota.addEventListener("change", () => editar(p.id, x => { x.nota = Number(nota.value); }));

  const sem = el("input", { type: "checkbox", checked: p.horario.sem });
  const abre = el("input", { type: "time", value: p.horario.abre, disabled: p.horario.sem });
  const fecha = el("input", { type: "time", value: p.horario.fecha, disabled: p.horario.sem });
  sem.addEventListener("change", () => { abre.disabled = fecha.disabled = sem.checked; editar(p.id, x => { x.horario.sem = sem.checked; }); });
  abre.addEventListener("change", () => editar(p.id, x => { x.horario.abre = abre.value || "00:00"; }));
  fecha.addEventListener("change", () => editar(p.id, x => { x.horario.fecha = fecha.value || "00:00"; }));

  const desc = el("textarea", { value: p.descricao, maxLength: 400, placeholder: "O que é este local?" });
  desc.addEventListener("change", () => editar(p.id, x => { x.descricao = desc.value; }));

  let confirmando = false;
  const apagar = el("button", { className: "perigo", textContent: "Apagar local" });
  apagar.addEventListener("click", () => {
    if (!confirmando) { confirmando = true; apagar.textContent = "Confirmar: apagar de vez"; return; }
    const id = p.id;
    selecionado = null;
    salvar(l => { const i = l.findIndex(x => x.id === id); if (i >= 0) l.splice(i, 1); });
  });

  box.replaceChildren(
    mapaBtn, situacao,
    el("div", { className: "campo" }, el("label", { textContent: "Nome do local" }), nome),
    el("div", { className: "campo" }, el("label", { textContent: "Avaliação (0 a 5)" }), el("div", { className: "nota-linha" }, nota, notaV)),
    el("div", { className: "campo" }, el("div", { className: "rotulo", textContent: "Horário de funcionamento" }),
      el("label", { className: "check" }, sem, "Sem horário de funcionamento"),
      el("div", { className: "linha" }, abre, el("span", { textContent: "às", style: "flex:none" }), fecha)),
    el("div", { className: "campo" }, el("label", { textContent: "Descrição" }), desc),
    apagar
  );
}

// ---------- posicionar o pin com um clique no mapa ----------
let colocando = null;
function iniciarColocacao(id) {
  const p = pins.find(x => x.id === id);
  if (!p) return;
  colocando = id;
  $("palco").classList.add("colocando");
  $("colocar-aviso").textContent = `Clique no mapa para posicionar “${p.nome}” · Esc cancela`;
  $("colocar-aviso").hidden = false;
}
function cancelarColocacao() {
  colocando = null;
  $("palco").classList.remove("colocando");
  $("colocar-aviso").hidden = true;
}
$("pins").addEventListener("pointerdown", ev => {
  if (!colocando || !isGM || ev.target !== $("pins")) return;
  const r = $("pins").getBoundingClientRect();
  const x = clamp((ev.clientX - r.left) / r.width, 0, 1);
  const y = clamp((ev.clientY - r.top) / r.height, 0, 1);
  const id = colocando;
  cancelarColocacao();
  editar(id, p => { p.noMapa = true; p.x = x; p.y = y; });
});

$("novo").addEventListener("click", async () => {
  cancelarColocacao();
  const p = { id: crypto.randomUUID(), nome: "Novo local", x: 0.5, y: 0.5, noMapa: false, nota: 0, horario: { sem: false, abre: "08:00", fecha: "18:00" }, descricao: "" };
  selecionado = p.id;
  await salvar(l => l.push(p));
});

// ---------- fechar ----------
const fechar = () => OBR.modal.close(MODAL_ID);
$("x").addEventListener("click", fechar);
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (colocando) { cancelarColocacao(); return; }
  if (!/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName)) fechar();
});

// ---------- início ----------
const imagem = new Promise((ok, erro) => { const i = new Image(); i.onload = () => ok(i); i.onerror = erro; i.src = "mapa.webp"; });
const pronto = new Promise(r => OBR.onReady(r));

(async () => {
  const [img] = await Promise.all([imagem, pronto]);
  ratio = img.naturalWidth / img.naturalHeight;
  isGM = (await OBR.player.getRole()) === "GM";
  pins = normalizar((await OBR.room.getMetadata())[KEY]);

  $("raiz").classList.toggle("gm", isGM);
  $("gm").hidden = !isGM;
  const { w, h } = aplicarTamanho();
  if (isGM) { renderLista(); renderEditor(); }
  renderPins();

  const reduzir = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduzir || !$("papel").animate) $("plano").style.opacity = "1";
  else await desdobrar(w, h);
  renderPins(true);   // os pins "pulam" depois que o mapa abre
  $("pins").style.visibility = "visible";

  new ResizeObserver(() => aplicarTamanho()).observe($("area"));

  OBR.room.onMetadataChange(m => {
    pins = normalizar(m[KEY]);
    if (selecionado && !pins.some(p => p.id === selecionado)) selecionado = null;
    if (colocando && !pins.some(p => p.id === colocando)) cancelarColocacao();
    if (arrastando) return;
    renderPins();
    if (isGM) {
      renderLista();
      const atual = pins.find(p => p.id === selecionado);
      if (editorPara !== selecionado || editorEstado !== (atual ? atual.noMapa : null)) renderEditor();
    }
  });
})();
</script>
</body>
